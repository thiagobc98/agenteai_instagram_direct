# Override de produção — usar sempre em conjunto com docker-compose.yml.
#
# Adiciona: proxy reverso com TLS automático (Caddy), restart policies e
# limites de recurso. Também DESPUBLICA as portas internas (db/redis/api/
# frontend): o Docker escreve direto no iptables e ignora o ufw, então fechar
# portas no firewall NÃO protegeria o Postgres. Em produção só o proxy expõe
# 80/443; os serviços conversam pela rede interna do compose.
# Requer Docker Compose >= 2.24 (tag !override). Ver docs/DEPLOY.md.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  db:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  redis:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  api:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  worker:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  frontend:
    restart: unless-stopped
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  caddy_data:
  caddy_config:
