# Docker Compose para desenvolvimento local.
# Sobe PostgreSQL (com pgvector), API e Worker.
#
# Uso:
#   docker compose up -d         # Sobe tudo
#   docker compose up -d db      # Só o banco
#   docker compose logs -f       # Logs
#   docker compose down          # Para tudo

services:
  db:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: whatsapp_langchain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/whatsapp_langchain
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
      MEDIA_STORAGE_DIR: /app/data/media
    # Mídia das publicações (a Meta baixa daqui via /media/<token>)
    volumes:
      - media_data:/app/data/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/whatsapp_langchain
      REDIS_URL: redis://redis:6379/0
      LOG_JSON: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  wuzapi:
    # WhatsApp (whatsmeow) que manda os avisos de mensagens novas do Direct
    # para o celular do atendente. Conectar/QR Code: tela "WhatsApp" do painel.
    # Só envia: a instância não tem webhook. Sem "ports": a API e o Worker
    # falam com ele pela rede interna (http://wuzapi:8080).
    restart: unless-stopped
    image: asternic/wuzapi:1.1.0
    command: ["--logtype=json", "--skipmedia", "--datadir=/data"]
    environment:
      TZ: America/Sao_Paulo
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:-}
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_GLOBAL_ENCRYPTION_KEY:-}
      SESSION_DEVICE_NAME: Berberich Avisos
      WUZAPI_SOCKET_RECOVERY: "true"
    volumes:
      - wuzapi_data:/data

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ""
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
  # Sessão do WhatsApp do Wuzapi: sem ele, QR Code de novo a cada deploy
  wuzapi_data:
